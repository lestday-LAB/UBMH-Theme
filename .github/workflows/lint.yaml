name: Lint

on:
  push:
    paths:
      - 'style/**'
      - '.github/workflows/lint.yaml'

jobs:
  lint:
    name: Check CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Stylelint
        run: pnpm run stylelint

      - name: Prettier
        run: pnpm run prettier
